services:
  - type: web
    name: cedric-backend
    env: python
    plan: free
    buildCommand: |
      pip install -r backend/requirements.txt
      cd backend/myproject
      python manage.py collectstatic --clear --noinput
    startCommand: gunicorn --chdir backend/myproject myproject.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --threads 2 --timeout 420 --graceful-timeout 60 --keep-alive 5 --max-requests 500 --max-requests-jitter 50
    envVars:
      - key: PYTHON_VERSION
        value: 3.14.2
      - key: PYTHONUNBUFFERED
        value: true
